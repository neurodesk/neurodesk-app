# Engine- and platform-independent run flags shared by every launch command.
commonLaunchArgs:
  - '--shm-size=1gb'
  - '--privileged'
  - '--user=root'
  - '--name {containerName}'
  - '-e NEURODESKTOP_VERSION={tag}'
  - '-e CVMFS_DISABLE={cvmfsDisable}'
  - '-e GRANT_SUDO=yes'
  - '-e NEURODESKTOP_CVMFS_STARTUP_MODE=eager'

# Engine-specific configurations.
#
# trailingImage marks the engines that take the image reference as a positional
# argument after the run flags (Docker, Podman). TinyRange passes it inline as
# --oci instead, so it must not get a trailing image name.
engines:
  podman: &podman_base
    base_cmd: 'podman run -d --rm'
    trailingImage: true

  docker: &docker_base
    base_cmd: 'docker run -d --rm'
    trailingImage: true

  tinyrange: &tinyrange_base
    base_cmd: '{tinyrangePath}'
    trailingImage: false

# Platform and engine-specific additional directory configurations
additionalDirConfig:
  tinyrange:
    windows: '--mount-rw "{additionalDir}":/data'
    unix: '--mount-rw "{additionalDir}":/data'
  podman:
    windows: '--volume "{additionalDir}":/data'
    unix: '--volume "{additionalDir}":/data'
  docker:
    windows: '--volume "{additionalDir}":/data'
    unix: '--volume "{additionalDir}":/data'

# Launch arguments matrix (engine x platform).
#
# These are run flags only. The image reference is appended by
# ContainerConfigParser.buildLaunchArgs after every flag — including the
# conditional ones below and the additional directory mount — so that Docker
# and Podman never see a run flag in container-command position.
launchArgs:
  podman:
    windows:
      <<: *podman_base
      args:
        - '{base_cmd}'
        - '{commonLaunchArgs}'
        - '-p 127.0.0.1:{port}:{containerPort}'
        - '-e NB_UID=1000 -e NB_GID=1000 -v {storageDir}:/neurodesktop-storage'
        - '-v {volume_mount}:/home/jovyan'
        - '--network bridge:ip=10.88.0.10,mac=88:75:56:ef:3e:d6'
        - '--add-host=host.docker.internal:!HOST_GATEWAY_IP! -e OLLAMA_HOST="http://host.docker.internal:11434"'
    unix:
      <<: *podman_base
      args:
        - '{base_cmd}'
        - '{commonLaunchArgs}'
        - '-p 127.0.0.1:{port}:{containerPort}'
        - '-e NB_UID="$(id -u)" -e NB_GID="$(id -g)" -v {storageDir}:/neurodesktop-storage'
        - '-v {volume_mount}:/home/jovyan'
        - '--network bridge:ip=10.88.0.10,mac=88:75:56:ef:3e:d6'
        - '--add-host=host.docker.internal:${HOST_GATEWAY_IP} -e OLLAMA_HOST="http://host.docker.internal:11434"'

  docker:
    windows:
      <<: *docker_base
      args:
        - '{base_cmd}'
        - '{commonLaunchArgs}'
        - '-p 127.0.0.1:{port}:{containerPort}'
        - '-e NB_UID=1000 -e NB_GID=1000 -v {storageDir}:/neurodesktop-storage'
        - '--mount source={volume_mount},target=/home/jovyan --mac-address=88:75:56:ef:3e:d6'
        - '--add-host=host.docker.internal:!HOST_GATEWAY_IP! -e OLLAMA_HOST="http://host.docker.internal:11434"'
    unix:
      <<: *docker_base
      args:
        - '{base_cmd}'
        - '{commonLaunchArgs}'
        - '-p 127.0.0.1:{port}:{containerPort}'
        - '-e NB_UID="$(id -u)" -e NB_GID="$(id -g)" -v {storageDir}:/neurodesktop-storage'
        - '--mount source={volume_mount},target=/home/jovyan --mac-address=88:75:56:ef:3e:d6'
        - '--add-host=host.docker.internal:${HOST_GATEWAY_IP} -e OLLAMA_HOST="http://host.docker.internal:11434"'

  tinyrange:
    windows:
      <<: *tinyrange_base
      args:
        - '{base_cmd}'
        - 'login'
        - '--buildDir {buildDir}'
        - '--oci {imageRegistry}'
        - '--forward {port}'
        - '-m //lib/qemu:user'
        - '--mount-rw {storageDir}:/neurodesktop-storage'
        - '--volume neurodeskHome,20480,/home,persist'
        - '--auto-scale'
    unix:
      <<: *tinyrange_base
      args:
        - '{base_cmd}'
        - 'login'
        - '--buildDir {buildDir}'
        - '--oci {imageRegistry}'
        - '--forward {port}'
        - '-m //lib/qemu:user'
        - '--mount-rw {storageDir}:/neurodesktop-storage'
        - '--volume neurodeskHome,20480,/home,persist'
        - '--auto-scale'

# Run flags that only apply when a host condition holds. Evaluated by
# ContainerConfigParser against the engine, the platform and the host OS
# version, and emitted with the other run flags — before the image name.
#
#   engines / platforms: restrict to those values (omit for "any")
#   minOsVersion:        numeric host OS version floor (Ubuntu YYMM, e.g. 2310);
#                        never matches when the OS version is unknown
conditionalRunArgs:
  - arg: '--security-opt apparmor=neurodeskapp'
    engines:
      - docker
    minOsVersion: 2310

# TinyRange -E prelude (env vars + fuse/permission setup before server args).
# It opens the -E quote that tinyrangePostArgs closes, so the two are only
# emitted together with the default server args.
tinyrangePrelude:
  windows: '-e NEURODESKTOP_VERSION={tag} -e CVMFS_DISABLE={cvmfsDisable} -e GRANT_SUDO=yes -e NEURODESKTOP_CVMFS_STARTUP_MODE=eager -E "chmod 777 /dev/fuse; chown -R 1000:1000 /neurodesktop-storage; chmod -R 777 /neurodesktop-storage;'
  unix: '-e NEURODESKTOP_VERSION={tag} -e CVMFS_DISABLE={cvmfsDisable} -e GRANT_SUDO=yes -e NEURODESKTOP_CVMFS_STARTUP_MODE=eager -E "chmod 777 /dev/fuse; chown -R "$(id -u)":"$(id -g)" /neurodesktop-storage; chmod -R 777 /neurodesktop-storage;'

# Appended to the TinyRange prelude when an additional directory is mounted at
# /data. TinyRange has no --user, so the mount is owned by root until fixed.
tinyrangeAdditionalDirPrelude:
  windows: ' find /data -maxdepth 1 -exec chown 1000:1000 {} + 2>/dev/null || true; find /data -maxdepth 1 -exec chmod 777 {} + 2>/dev/null || true;'
  unix: ' find /data -maxdepth 1 -exec chown "$(id -u)":"$(id -g)" {} + 2>/dev/null || true; find /data -maxdepth 1 -exec chmod 777 {} + 2>/dev/null || true;'

# Default server launch arguments (skipped when overrideDefaultServerArgs is set)
# For Docker/Podman, {serverPort} resolves to {containerPort} (8888).
# For TinyRange, {serverPort} resolves to {port} (the forwarded port).
defaultServerArgs:
  - "start.sh jupyter lab --ServerApp.password=''"
  - '--no-browser'
  - '--expose-app-in-browser'
  - "--ServerApp.token='{token}'"
  - '--ServerApp.port={serverPort}'
  - '--LabApp.quit_button=False'
  - '--NotebookIntelligence.github_access_token=remember'

# Extra args appended after defaultServerArgs for TinyRange only
tinyrangePostArgs: '--FileContentsManager.delete_to_trash=False"'

# Port JupyterLab listens on inside the container. Docker/Podman publish the
# host port onto this one; TinyRange forwards the host port directly instead.
containerPort: '8888'
