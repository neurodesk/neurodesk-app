name: Check for new Neurodesk releases

on:
  schedule:
    - cron: 30 17 * * *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check_for_updates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'

      - name: Install Python dependencies
        run: |
          python -m pip install tbump

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Install npm dependencies
        run: |
          npm install --global yarn
          yarn install
        
      - name: Check for new Neurodesk releases
        shell: bash
        run: |
          set -eux
          NEURODESK_LATEST=$(python scripts/get_neurodesk_version.py)
          if [[ -z "${NEURODESK_LATEST}" || "${NEURODESK_LATEST}" == "None" ]]; then
            echo "Could not determine the latest Neurodesk version (got '${NEURODESK_LATEST}')" >&2
            exit 1
          fi
          echo "neurodesk_latest=${NEURODESK_LATEST}" >> $GITHUB_ENV
          yarn set_neurodesk_version ${NEURODESK_LATEST}

      - name: Create a PR if needed
        shell: bash
        env:
          GITHUB_USER: ${{ secrets.GITHUB_USER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          NEURODESK_LATEST=${{ env.neurodesk_latest }}

          if [[ -z "$(git status --porcelain neurodesktop.toml)" ]]; then
            echo "neurodesktop.toml is already at v${NEURODESK_LATEST} - nothing to do."
            exit 0
          fi

          BRANCH_NAME=update-neurodesk-to-v${NEURODESK_LATEST}

          # A leftover branch on origin means this PR was already raised (branches
          # are not always deleted once merged). Recreating it here would produce a
          # new commit and a non-fast-forward push, so skip instead.
          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH_NAME} already exists on origin - PR already raised, skipping."
            exit 0
          fi

          git config user.name "Neurodesk Desktop Bot"
          git config user.email 'neurodesk-bot@users.noreply.github.com'

          git checkout -b "${BRANCH_NAME}"
          git commit neurodesktop.toml -m "Update to Neurodesk v${NEURODESK_LATEST}"
          git push --set-upstream origin "${BRANCH_NAME}"

          sudo apt install hub
          hub pull-request -m "Update to Neurodesk v${NEURODESK_LATEST}" \
              -m "New Neurodesk release [v${NEURODESK_LATEST}](https://github.com/NeuroDesk/neurodesk.github.io/blob/main/data/neurodesktop.toml) is available. Please review the lock file carefully."
