# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  # Do not post review status messages (e.g. skipped-review notices), which
  # trigger notification emails.
  review_status: false
  auto_review:
    # Only review when explicitly requested with "@coderabbitai review".
    enabled: false
    auto_incremental_review: false
